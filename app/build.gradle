plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.0'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.0'
    id 'kotlin-kapt'
}

kotlin {
    jvmToolchain(17)
}

android {
    namespace 'edu.gtri.gpssample'
    compileSdk = 36

    defaultConfig {
        applicationId = "edu.gtri.gpssample"
        minSdk = 26
        targetSdk = 36
        versionCode = 32
        versionName = "3.0.0 beta-13"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
        dataBinding = true
        compose = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'                          // 1.19 requires APK 37
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'com.google.guava:guava:33.7.1-android'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation "androidx.core:core-splashscreen:1.2.0"
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.github.androidmads:QRGenerator:1.0.1'
    implementation("androidx.cardview:cardview:1.0.0")

    // CameraX
    implementation "androidx.camera:camera-camera2:1.6.1"
    implementation "androidx.camera:camera-lifecycle:1.6.1"
    implementation "androidx.camera:camera-view:1.6.1"

    // Google PlayServices
    implementation("com.google.android.gms:play-services-nearby:19.3.0")    // don't upgrade
    implementation("com.google.android.gms:play-services-location:21.3.0")  // don't upgrade
    implementation("com.google.android.gms:play-services-maps:20.0.0")

    // Jetpack Compose
    def composeBom = platform('androidx.compose:compose-bom:2025.12.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // MapBox
    implementation 'com.mapbox.maps:android-ndk27:11.18.0'

    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation "io.reactivex.rxjava2:rxkotlin:2.3.0"
    implementation "io.reactivex.rxjava2:rxandroid:2.1.0"

    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3") // 1.8.x causes Kotlin 2.1.0 FIR compiler crash during compilation.

    implementation("org.nanohttpd:nanohttpd:2.3.1")
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'com.github.MKergall:osmbonuspack:6.9.0'
    implementation("com.google.code.gson:gson:2.14.0")
    implementation 'org.locationtech.jts:jts-core:1.20.0'
    implementation("io.github.dellisd.spatialk:geojson:0.3.0")  // TODO: migrate to org.maplibre.spatialk.geojson...

//    debugImplementation("com.squareup.leakcanary:leakcanary-android:2.14")
}
